name: CI

# Runs on pull requests so a broken finance calculation never reaches main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Worker is a separate npm project with its own toolchain, so that
      # importing it cannot drag Cloudflare's global types into the app's.
      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Scan for secrets
        run: npm run scan:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck the Worker
        run: npm run typecheck:worker

      - name: Unit tests
        run: npm run test

      - name: Worker tests
        run: npm run test:worker

      - name: Build
        run: npm run build:only
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # Playwright builds and serves the app itself; the base path must match
        # what the e2e config expects rather than the repo name.
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
