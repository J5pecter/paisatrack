name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages on every push to main.
# This repo is public, so Actions minutes here are unlimited and free.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish Pages, but nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        # The base path must match the repo name or every asset 404s on Pages.
        # Deriving it here means renaming the repo cannot silently break the site.
        run: npm run build:only
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: SPA fallback
        # Pages has no rewrite rules, so a deep link like /cards would 404.
        # Serving index.html as 404.html hands those routes back to the router.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
