#:schema node_modules/wrangler/config-schema.json
name = "paisatrack"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Everything below fits inside the Workers Free plan, and nothing here requires
# a payment method. See README.md for the one-time setup.

# Workers AI. The free allocation is 10,000 neurons/day, shared across the
# account — roughly 50-150 statement pages depending on how dense they are.
[ai]
binding = "AI"

# Push subscriptions: an endpoint and a list of dates. Never an amount.
[[kv_namespaces]]
binding = "PUSH"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# The records themselves. Free tier: 5 GB, 5M row reads/day, 100k row
# writes/day — against which one person's finances are a rounding error.
[[d1_databases]]
binding = "DB"
database_name = "paisatrack"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Add your own origin here if you fork and deploy to a different Pages site.
# The first entry is the fallback used when a request arrives with no Origin.
ALLOWED_ORIGINS = "https://j5pecter.github.io,http://localhost:4180,http://localhost:5173"
VAPID_SUBJECT = "mailto:you@example.com"

# 03:30 UTC is 09:00 IST — morning, not the middle of the night. Cron triggers
# are UTC only, so this moves by an hour in countries that observe DST. India
# does not.
[triggers]
crons = ["30 3 * * *"]

# Secrets are NOT set here. `wrangler secret put` keeps them out of the repo:
#   API_TOKEN           shared secret, also pasted into PaisaTrack's settings
#   VAPID_PUBLIC_KEY    base64url of the uncompressed P-256 point
#   VAPID_PRIVATE_JWK   the private half, as a JWK
# Generate the VAPID pair with:  node ../scripts/gen-vapid.mjs
